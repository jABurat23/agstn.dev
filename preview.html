<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Minimal preview of the AG$TN portfolio navigation and hero."
    />
    <title>AG$TN — Hero Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #070b12;
        --deep-surface: #0d1420;
        --raised-surface: #121d2b;
        --primary-text: #ecf4fa;
        --secondary-text: #a5b4c4;
        --muted-text: #718398;
        --primary-accent: #62e6f2;
        --secondary-accent: #5b8cff;
        --hairline: rgb(165 180 196 / 16%);
        --halo: rgb(98 230 242 / 14%);
      }

      [data-theme="light"] {
        color-scheme: light;
        --ink: #f3f6f8;
        --deep-surface: #e9eef2;
        --raised-surface: #fff;
        --primary-text: #101a27;
        --secondary-text: #526274;
        --muted-text: #5f7082;
        --primary-accent: #087f8c;
        --secondary-accent: #315fcb;
        --hairline: rgb(16 26 39 / 15%);
        --halo: rgb(98 230 242 / 21%);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--ink);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--ink);
        color: var(--primary-text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        transition:
          background-color 250ms ease,
          color 250ms ease;
      }

      button,
      a {
        color: inherit;
        font: inherit;
      }

      a {
        text-decoration: none;
      }

      a:hover {
        color: var(--primary-accent);
      }

      :focus-visible {
        outline: 2px solid var(--primary-accent);
        outline-offset: 5px;
      }

      .shell {
        width: min(100% - 48px, 1440px);
        margin-inline: auto;
      }

      .nav {
        min-height: 88px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: clamp(20px, 3vw, 42px);
        border-bottom: 1px solid var(--hairline);
      }

      .nav a {
        color: var(--secondary-text);
        font-size: 14px;
        font-weight: 500;
        transition: color 160ms ease;
      }

      .theme-toggle {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--secondary-text);
        cursor: pointer;
        transition: color 160ms ease;
      }

      .theme-toggle:hover {
        color: var(--primary-accent);
      }

      .theme-toggle svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.6;
      }

      .hero {
        min-height: min(760px, calc(100svh - 88px));
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
        align-items: center;
        gap: clamp(24px, 5vw, 76px);
        padding-block: clamp(44px, 8vh, 92px);
      }

      .hero-copy {
        min-width: 0;
        padding-block: 20px;
      }

      h1 {
        margin: 0;
        font-family:
          "Arial Black", Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(4rem, 9.4vw, 9rem);
        font-weight: 900;
        letter-spacing: -0.095em;
        line-height: 0.86;
        white-space: nowrap;
      }

      .wordmark-inner {
        letter-spacing: -0.11em;
      }

      .typing-cursor {
        display: inline-block;
        width: 0.055em;
        height: 0.58em;
        margin-left: 0.09em;
        background: var(--primary-accent);
        vertical-align: 0.01em;
        animation: cursor-blink 900ms steps(2, start) infinite;
      }

      .intro {
        max-width: 570px;
        margin: clamp(30px, 5vw, 50px) 0 0;
        color: var(--secondary-text);
        font-size: clamp(16px, 1.5vw, 19px);
        line-height: 1.8;
      }

      .details {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 26px;
        margin-top: 25px;
        color: var(--muted-text);
        font-size: 12px;
        line-height: 1.6;
      }

      .details span {
        white-space: nowrap;
      }

      .details strong {
        margin-right: 6px;
        color: var(--secondary-text);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .portrait {
        position: relative;
        width: min(100%, 470px);
        aspect-ratio: 0.9;
        justify-self: end;
        isolation: isolate;
      }

      .portrait::before {
        position: absolute;
        z-index: -1;
        inset: 10% 1% 6%;
        border-radius: 50%;
        background:
          radial-gradient(
            ellipse at 47% 43%,
            rgb(98 230 242 / 20%) 0%,
            var(--halo) 36%,
            rgb(91 140 255 / 9%) 59%,
            transparent 74%
          );
        content: "";
        filter: blur(15px);
      }

      .portrait svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .portrait-note {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      .light-icon {
        display: none;
      }

      [data-theme="light"] .dark-icon {
        display: none;
      }

      [data-theme="light"] .light-icon {
        display: block;
      }

      @keyframes cursor-blink {
        to {
          visibility: hidden;
        }
      }

      @media (min-width: 1450px) {
        h1 {
          font-size: 136px;
        }
      }

      @media (max-width: 760px) {
        .shell {
          width: min(100% - 40px, 600px);
        }

        .nav {
          min-height: 72px;
          gap: 22px;
        }

        .nav a {
          font-size: 13px;
        }

        .hero {
          min-height: auto;
          grid-template-columns: minmax(0, 1fr);
          gap: 22px;
          padding-block: 56px 42px;
        }

        .hero-copy {
          padding: 0;
        }

        h1 {
          font-size: clamp(3.25rem, 12.7vw, 6rem);
        }

        .intro {
          max-width: 540px;
          margin-top: 30px;
        }

        .details {
          gap: 8px 18px;
          margin-top: 18px;
        }

        .portrait {
          width: min(100%, 390px);
          justify-self: center;
          margin-top: 4px;
        }
      }

      @media (max-width: 380px) {
        .shell {
          width: min(100% - 32px, 600px);
        }

        h1 {
          font-size: clamp(3rem, 12.2vw, 3.35rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="nav" aria-label="Main navigation">
        <a href="#projects">Projects</a>
        <a href="#experience">Experience</a>
        <button
          class="theme-toggle"
          type="button"
          aria-label="Switch to light theme"
          title="Toggle theme"
        >
          <svg class="dark-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
            />
          </svg>
          <svg class="light-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z" />
          </svg>
        </button>
      </nav>

      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title" aria-label="[AG$TN]">
            <span aria-hidden="true">[</span><span class="wordmark-inner" aria-hidden="true"></span><span aria-hidden="true">]</span>
          </h1>

          <p class="intro">
            BSIT student and developer building lightweight digital systems,
            interfaces, and tools with an emphasis on performance, simplicity,
            and control.
          </p>

          <div class="details" aria-label="Profile details">
            <span><strong>Location</strong> PH</span>
            <span><strong>Status</strong> Building</span>
            <span><strong>Focus</strong> Software / Web</span>
          </div>
        </div>

        <div class="portrait" role="img" aria-label="Portrait layout preview; simplified illustration, not the live 3D model.">
          <span class="portrait-note">Simplified portrait artwork placeholder for layout review.</span>
          <svg viewBox="0 0 460 510" aria-hidden="true">
            <defs>
              <radialGradient id="halo" cx="50%" cy="46%" r="55%">
                <stop offset="0" stop-color="#62e6f2" stop-opacity=".18" />
                <stop offset=".5" stop-color="#5b8cff" stop-opacity=".11" />
                <stop offset="1" stop-color="#070b12" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="skin" x1="15%" y1="0%" x2="85%" y2="100%">
                <stop offset="0" stop-color="#f3f7fa" />
                <stop offset=".62" stop-color="#a5b4c4" />
                <stop offset="1" stop-color="#718398" />
              </linearGradient>
              <linearGradient id="shirt" x1="20%" y1="0%" x2="85%" y2="100%">
                <stop offset="0" stop-color="#5b8cff" stop-opacity=".76" />
                <stop offset=".58" stop-color="#183866" stop-opacity=".9" />
                <stop offset="1" stop-color="#0d1420" />
              </linearGradient>
              <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0" stop-color="#25364a" />
                <stop offset="1" stop-color="#101a27" />
              </linearGradient>
              <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="18" />
              </filter>
            </defs>
            <ellipse cx="230" cy="255" rx="210" ry="230" fill="url(#halo)" />
            <ellipse cx="230" cy="432" rx="115" ry="25" fill="#62e6f2" opacity=".12" filter="url(#softGlow)" />
            <path
              d="M72 510c11-91 71-145 158-151 88 6 148 60 158 151H72Z"
              fill="url(#shirt)"
            />
            <path
              d="M181 341c7-23 9-45 7-66h84c-2 24 1 47 11 68l-50 41-52-43Z"
              fill="url(#skin)"
            />
            <path
              d="M145 158c0-67 35-109 86-109 55 0 88 42 86 111l-8 95c-5 47-38 83-78 83-42 0-74-36-79-83l-7-97Z"
              fill="url(#skin)"
            />
            <path
              d="M145 167c-9-66 3-119 47-142 42-22 99-11 124 28 16 25 17 56 9 91-10-13-22-24-37-31-28-14-49-34-63-55-16 39-42 68-80 91Z"
              fill="url(#hair)"
            />
            <path d="M163 206c14-9 29-9 43-2" fill="none" stroke="#26384d" stroke-width="7" stroke-linecap="round" />
            <path d="M254 204c14-7 28-7 42 2" fill="none" stroke="#26384d" stroke-width="7" stroke-linecap="round" />
            <ellipse cx="184" cy="226" rx="8" ry="5" fill="#101a27" />
            <ellipse cx="273" cy="226" rx="8" ry="5" fill="#101a27" />
            <path d="M228 222c-4 20-10 40-16 54 8 6 18 7 27 3" fill="none" stroke="#718398" stroke-width="5" stroke-linecap="round" />
            <path d="M201 297c18 11 39 11 57 0" fill="none" stroke="#526274" stroke-width="5" stroke-linecap="round" />
            <path d="M75 483c20-71 61-105 117-119l38 32-46 114H75Z" fill="#62e6f2" opacity=".12" />
            <path d="M385 483c-20-71-61-105-117-119l-38 32 46 114h109Z" fill="#5b8cff" opacity=".17" />
          </svg>
        </div>
      </section>
    </main>

    <script>
      const root = document.documentElement;
      const themeButton = document.querySelector(".theme-toggle");
      const wordmark = document.querySelector(".wordmark-inner");
      const fullName = "AG$TN";
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      themeButton.addEventListener("click", () => {
        const nextTheme =
          root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = nextTheme;
        themeButton.setAttribute(
          "aria-label",
          nextTheme === "dark" ? "Switch to light theme" : "Switch to dark theme",
        );
      });

      if (reducedMotion) {
        wordmark.textContent = fullName;
      } else {
        let index = 0;
        const typeNextCharacter = () => {
          index += 1;
          wordmark.textContent = fullName.slice(0, index);

          if (index < fullName.length) {
            window.setTimeout(typeNextCharacter, 150);
          } else {
            document.querySelector(".typing-cursor")?.remove();
          }
        };

        wordmark.insertAdjacentHTML(
          "afterend",
          '<span class="typing-cursor" aria-hidden="true"></span>',
        );
        window.setTimeout(typeNextCharacter, 180);
      }
    </script>
  </body>
</html>
